name: Plugin distribution

on:
  pull_request:
  push:
    branches: [main, graph-instrument]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 35
    env:
      CHROME_BIN: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Check browser dependencies
        run: |
          "$CHROME_BIN" --version
          if ! command -v ffmpeg >/dev/null; then
            brew install ffmpeg
          fi
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Graph Flow checks, including headless Chrome
        run: python -I -S -B -m unittest discover -s skills/graph-flow/tests -v
      - name: Distribution and documentation checks
        run: python -I -S -B -m unittest discover -s scripts/tests -v
      - name: Eval runner checks
        run: python -I -S -B -m unittest discover -s dev/eval/tests -t dev/eval -v
      - name: Capture dashboard scenes in WebGL and forced SVG
        run: |
          export SCREENS_PYTHON="$(command -v python)"
          webgl="$RUNNER_TEMP/graph-flow-webgl"
          svg="$RUNNER_TEMP/graph-flow-svg"
          python -I -S -B dev/screens/build_fixtures.py "$webgl"
          node dev/screens/capture.mjs "$webgl"
          python -I -S -B dev/screens/build_fixtures.py "$svg"
          SCREENS_RENDERER=svg node dev/screens/capture.mjs "$svg"
      - name: Whitespace checks
        run: git diff --check
